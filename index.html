<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TARDIP — Antipode Viewer</title>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="ui-overlay">
      <div id="search-container">
        <div id="search-wrapper">
          <svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search city, postal code, country…"
            autocomplete="off"
          />
        </div>
        <div id="search-results"></div>
      </div>

      <button id="my-location-btn" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v4m0 12v4m10-10h-4M6 12H2" />
        </svg>
      </button>

      <div id="zoom-controls">
        <button id="zoom-in-btn" title="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <button id="zoom-out-btn" title="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>

      <button id="layer-toggle-btn" title="Toggle satellite/map view">
        <svg id="layer-icon-satellite" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="7" height="7" />
        </svg>
        <svg id="layer-icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="display:none">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" />
          <line x1="8" y1="2" x2="8" y2="18" /><line x1="16" y1="6" x2="16" y2="22" />
        </svg>
      </button>

      <div id="info-panel">
        <div id="info-content"></div>
      </div>

      <div id="loading-indicator">
        <div class="spinner"></div>
        <span>Locating…</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
