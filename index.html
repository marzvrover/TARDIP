<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TARDIP — Antipode Viewer</title>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="ui-overlay">
      <div id="search-container">
        <div id="search-wrapper">
          <svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search city, postal code, country…"
            autocomplete="off"
          />
        </div>
        <div id="search-results"></div>
      </div>

      <button id="my-location-btn" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v4m0 12v4m10-10h-4M6 12H2" />
        </svg>
      </button>

      <div id="info-panel">
        <div id="info-content"></div>
      </div>

      <div id="loading-indicator">
        <div class="spinner"></div>
        <span>Locating…</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
